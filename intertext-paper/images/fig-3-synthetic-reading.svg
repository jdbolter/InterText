<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2.4}
      .t{font-size:28px;fill:#111;font-weight:700}
      .tb{font-size:25px;fill:#111;font-weight:700}
      .s{font-size:23px;fill:#333}
      .si{font-size:22px;fill:#333}
      .xs{font-size:21px;fill:#555}
      .ln{stroke:#333;stroke-width:2.6;fill:none}
      .gold{stroke:#8a5a00;stroke-width:2.6;fill:none;stroke-dasharray:10 8}
      .lab{font-size:21px;fill:#333;font-style:italic}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <!-- Reader characters -->
  <rect class="box" x="20" y="20" width="360" height="240" rx="10" style="fill:#f4efe6"/>
  <text class="t" x="200" y="60" text-anchor="middle">Reader characters</text>
  <text class="si" x="42" y="98">• curious</text>
  <text class="si" x="42" y="128">• skeptical</text>
  <text class="si" x="42" y="158">• collaborative</text>
  <text class="si" x="42" y="188">• general (the target reader)</text>
  <text class="si" x="42" y="218">• student (an assigned chapter)</text>
  <path class="ln" d="M200,260 L200,315" marker-end="url(#a)"/>

  <!-- Synthetic reader -->
  <rect class="box" x="20" y="320" width="360" height="250" rx="12" style="fill:#f4efe6"/>
  <text class="t" x="200" y="362" text-anchor="middle">Synthetic reader</text>
  <text class="si" x="200" y="398" text-anchor="middle">GPT 5.6 terra (OpenAI)</text>
  <text class="si" x="200" y="424" text-anchor="middle">plays the character:</text>
  <text class="si" x="200" y="450" text-anchor="middle">asks, reads on, moves or stops</text>
  <text class="xs" x="200" y="496" text-anchor="middle">and notes privately, each turn,</text>
  <text class="xs" x="200" y="522" text-anchor="middle">its understanding, confusion</text>
  <text class="xs" x="200" y="548" text-anchor="middle">and interest</text>

  <!-- InterText -->
  <rect class="box" x="470" y="320" width="330" height="250" rx="12" style="fill:#eef3f8"/>
  <text class="t" x="635" y="362" text-anchor="middle">InterText</text>
  <text class="si" x="635" y="398" text-anchor="middle">the whole system, as a</text>
  <text class="si" x="635" y="424" text-anchor="middle">person would meet it:</text>
  <text class="si" x="635" y="450" text-anchor="middle">draft, revision, notes</text>
  <text class="si" x="635" y="476" text-anchor="middle">and media</text>
  <text class="xs" x="635" y="522" text-anchor="middle">the published book</text>
  <text class="xs" x="635" y="548" text-anchor="middle">is never changed</text>
  <path class="ln" d="M384,420 L466,420" marker-end="url(#a)"/>
  <path class="ln" d="M466,480 L384,480" marker-end="url(#a)"/>
  <text class="lab" x="425" y="406" text-anchor="middle" style="font-size:19px">dialogue</text>

  <!-- Transcript -->
  <rect class="box" x="470" y="60" width="330" height="170" rx="10"/>
  <text class="t" x="635" y="102" text-anchor="middle">Transcript</text>
  <text class="si" x="635" y="138" text-anchor="middle">every turn, with the</text>
  <text class="si" x="635" y="164" text-anchor="middle">draft before revision</text>
  <text class="si" x="635" y="190" text-anchor="middle">and the reader's notes</text>
  <path class="ln" d="M635,316 L635,234" marker-end="url(#a)"/>

  <!-- Evaluation -->
  <rect x="870" y="20" width="710" height="554" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="2.4"/>
  <text class="t" x="1225" y="58" text-anchor="middle">Evaluation</text>
  <path class="ln" d="M800,145 L866,145" marker-end="url(#a)"/>

  <rect class="box" x="890" y="76" width="320" height="176" rx="10" style="fill:#eef3f8"/>
  <text class="tb" x="1050" y="110" text-anchor="middle">Measures</text>
  <text class="si" x="1050" y="144" text-anchor="middle">counted by script:</text>
  <text class="si" x="1050" y="170" text-anchor="middle">length, notes, repeats,</text>
  <text class="si" x="1050" y="196" text-anchor="middle">hedges and absolutes,</text>
  <text class="si" x="1050" y="222" text-anchor="middle">the reader's notes</text>

  <rect class="box" x="1230" y="76" width="330" height="176" rx="10" style="fill:#eef3f8"/>
  <text class="tb" x="1395" y="110" text-anchor="middle">Blind judge</text>
  <text class="si" x="1395" y="144" text-anchor="middle">a Claude agent reads</text>
  <text class="si" x="1395" y="170" text-anchor="middle">the replies shuffled,</text>
  <text class="si" x="1395" y="196" text-anchor="middle">not knowing which</text>
  <text class="si" x="1395" y="222" text-anchor="middle">version wrote them</text>

  <rect class="box" x="890" y="284" width="670" height="110" rx="10" style="fill:#f4efe6"/>
  <text class="tb" x="1225" y="318" text-anchor="middle">By the author</text>
  <text class="si" x="1225" y="350" text-anchor="middle">reads the transcripts, the judge's report and the measures;</text>
  <text class="si" x="1225" y="376" text-anchor="middle">records verdicts and decides what to change</text>
  <path class="ln" d="M1050,252 L1050,280" marker-end="url(#a)"/>
  <path class="ln" d="M1395,252 L1395,280" marker-end="url(#a)"/>

  <rect class="box" x="890" y="414" width="670" height="140" rx="10"/>
  <text class="tb" x="1225" y="448" text-anchor="middle">Criteria</text>
  <text class="si" x="910" y="484">• flow of the argument; drift</text>
  <text class="si" x="910" y="512">• use of the fund</text>
  <text class="si" x="1235" y="484">• the author's tone; LLM tics</text>
  <text class="si" x="1235" y="512">• citations, links and media</text>

  <!-- Outcomes -->
  <rect class="box" x="870" y="680" width="710" height="200" rx="12"/>
  <text class="t" x="1225" y="720" text-anchor="middle">Revisions</text>
  <text class="s" x="1225" y="756" text-anchor="middle">system prompts; points and vignettes; library</text>
  <text class="s" x="1225" y="784" text-anchor="middle">and media lists; corrections to the book's text</text>
  <text class="xs" x="1225" y="830" text-anchor="middle">an editorial preview may show how the book would</text>
  <text class="xs" x="1225" y="856" text-anchor="middle">evolve from a reading; it is never published</text>
  <path class="gold" d="M1560,339 L1592,339 L1592,780 L1584,780" marker-end="url(#ag)"/>
  <text x="1584" y="636" text-anchor="end" style="font-size:21px;fill:#8a5a00;font-style:italic">author decides</text>

  <!-- Loop back -->
  <path class="ln" d="M866,780 L635,780 L635,575" marker-end="url(#a)"/>
  <text class="lab" x="750" y="766" text-anchor="middle">next round of</text>
  <text class="lab" x="750" y="808" text-anchor="middle">synthetic readings</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
