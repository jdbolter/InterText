<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2.4}
      .t{font-size:28px;fill:#111;font-weight:700}
      .tb{font-size:25px;fill:#111;font-weight:700}
      .s{font-size:23px;fill:#333}
      .si{font-size:22px;fill:#333}
      .xs{font-size:21px;fill:#555}
      .ln{stroke:#333;stroke-width:2.6;fill:none}
      .gold{stroke:#8a5a00;stroke-width:2.6;fill:none;stroke-dasharray:10 8}
      .lab{font-size:21px;fill:#333;font-style:italic}
      .gl{font-size:21px;fill:#8a5a00;font-style:italic}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#fff"/>

  <!-- Author and original text -->
  <rect class="box" x="20" y="40" width="250" height="110" rx="10" style="fill:#f4efe6"/>
  <text class="t" x="145" y="86" text-anchor="middle">Author</text>
  <text class="s" x="145" y="122" text-anchor="middle">writes the book</text>

  <rect class="box" x="20" y="330" width="250" height="165" rx="10"/>
  <text class="t" x="145" y="376" text-anchor="middle">Original text</text>
  <text class="s" x="145" y="414" text-anchor="middle">the author's book,</text>
  <text class="s" x="145" y="442" text-anchor="middle">divided into</text>
  <text class="s" x="145" y="470" text-anchor="middle">sections</text>
  <path class="ln" d="M145,150 L145,325" marker-end="url(#a)"/>
  <path class="ln" d="M270,412 L300,412" marker-end="url(#a)"/>

  <!-- System prompts -->
  <rect class="box" x="305" y="20" width="640" height="180" rx="10" style="fill:#eef3f8"/>
  <text class="t" x="625" y="58" text-anchor="middle">System prompts</text>
  <text class="xs" x="625" y="86" text-anchor="middle">the same for every text</text>
  <text class="si" x="327" y="120">• develop the original's argument, without drift</text>
  <text class="si" x="327" y="150">• keep close to the author's tone; avoid LLM tics</text>
  <text class="si" x="327" y="180">• cite only from the library</text>

  <!-- The interactive book -->
  <rect x="305" y="230" width="640" height="490" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="2.4"/>
  <text class="t" x="625" y="270" text-anchor="middle">The interactive book</text>

  <rect class="box" x="323" y="290" width="296" height="120" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="471" y="324" text-anchor="middle">Opening vignettes</text>
  <text class="si" x="471" y="356" text-anchor="middle">one per section; fixed,</text>
  <text class="si" x="471" y="382" text-anchor="middle">the only canonical text</text>

  <rect class="box" x="633" y="290" width="294" height="120" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="780" y="324" text-anchor="middle">Points</text>
  <text class="si" x="780" y="356" text-anchor="middle">the argument of each</text>
  <text class="si" x="780" y="382" text-anchor="middle">section and chapter</text>

  <rect class="box" x="323" y="422" width="296" height="148" rx="8"/>
  <text class="tb" x="471" y="456" text-anchor="middle">Spine</text>
  <text class="si" x="471" y="488" text-anchor="middle">the book's text, section</text>
  <text class="si" x="471" y="514" text-anchor="middle">by section, in passages;</text>
  <text class="si" x="471" y="540" text-anchor="middle">never shown as such</text>

  <rect class="box" x="633" y="422" width="294" height="148" rx="8" style="stroke-dasharray:9 7"/>
  <text class="tb" x="780" y="456" text-anchor="middle">Fund</text>
  <text class="si" x="780" y="488" text-anchor="middle">extra units, built up</text>
  <text class="si" x="780" y="514" text-anchor="middle">over time; drawn on</text>
  <text class="si" x="780" y="540" text-anchor="middle">when warranted</text>

  <rect class="box" x="323" y="582" width="296" height="120" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="471" y="616" text-anchor="middle">Library</text>
  <text class="si" x="471" y="648" text-anchor="middle">verified references, the</text>
  <text class="si" x="471" y="674" text-anchor="middle">only works it may cite</text>

  <rect class="box" x="633" y="582" width="294" height="120" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="780" y="616" text-anchor="middle">Media</text>
  <text class="si" x="780" y="648" text-anchor="middle">checked images</text>
  <text class="si" x="780" y="674" text-anchor="middle">and videos</text>

  <!-- Web search -->
  <rect class="box" x="1000" y="40" width="270" height="100" rx="10" style="fill:#eef3f8;stroke-dasharray:9 7"/>
  <text class="tb" x="1135" y="80" text-anchor="middle">Web search</text>
  <text class="xs" x="1135" y="114" text-anchor="middle">facts beyond the book</text>
  <path class="ln" d="M1135,140 L1135,225" marker-end="url(#a)"/>

  <!-- LLM: two passes -->
  <rect x="985" y="230" width="300" height="460" rx="14" fill="#eef3f8" stroke="#333" stroke-width="2.4"/>
  <text class="t" x="1135" y="270" text-anchor="middle">LLM, two passes</text>

  <rect class="box" x="1000" y="290" width="270" height="150" rx="8"/>
  <text class="tb" x="1135" y="324" text-anchor="middle">1  Draft</text>
  <text class="si" x="1135" y="358" text-anchor="middle">speaks as the text,</text>
  <text class="si" x="1135" y="384" text-anchor="middle">answering the reader</text>
  <text class="si" x="1135" y="410" text-anchor="middle">from the section</text>

  <rect class="box" x="1000" y="490" width="270" height="180" rx="8"/>
  <text class="tb" x="1135" y="524" text-anchor="middle">2  Revision</text>
  <text class="si" x="1135" y="558" text-anchor="middle">edits the draft for</text>
  <text class="si" x="1135" y="584" text-anchor="middle">style and length, close</text>
  <text class="si" x="1135" y="610" text-anchor="middle">to the author's tone;</text>
  <text class="si" x="1135" y="636" text-anchor="middle">adds no new ideas</text>
  <path class="ln" d="M1135,440 L1135,485" marker-end="url(#a)"/>

  <path class="ln" d="M945,475 L980,475" marker-end="url(#a)"/>
  <path class="ln" d="M945,110 C975,110 985,160 995,225" marker-end="url(#a)"/>
  <text class="lab" x="962" y="223" text-anchor="end">steer</text>

  <!-- Reader -->
  <rect class="box" x="1370" y="290" width="210" height="390" rx="12" style="fill:#f4efe6"/>
  <text class="t" x="1475" y="378" text-anchor="middle">Reader</text>
  <text class="s" x="1475" y="418" text-anchor="middle">reads,</text>
  <text class="s" x="1475" y="446" text-anchor="middle">questions,</text>
  <text class="s" x="1475" y="474" text-anchor="middle">challenges,</text>
  <text class="s" x="1475" y="502" text-anchor="middle">comments</text>
  <text class="xs" x="1475" y="560" text-anchor="middle">chooses at the</text>
  <text class="xs" x="1475" y="586" text-anchor="middle">start whether</text>
  <text class="xs" x="1475" y="612" text-anchor="middle">to contribute</text>
  <path class="ln" d="M1366,365 L1290,365" marker-end="url(#a)"/>
  <text class="lab" x="1327" y="352" text-anchor="middle" style="font-size:19px">question</text>
  <path class="ln" d="M1290,600 L1366,600" marker-end="url(#a)"/>
  <text class="lab" x="1327" y="587" text-anchor="middle" style="font-size:19px">reply</text>

  <!-- Contribution loop -->
  <path class="ln" d="M1475,680 L1475,775" marker-end="url(#a)"/>
  <text class="lab" x="1462" y="718" text-anchor="end">end of session,</text>
  <text class="lab" x="1462" y="744" text-anchor="end">if contributing</text>

  <rect class="box" x="1100" y="780" width="480" height="195" rx="12" style="fill:#f7f7f7"/>
  <text class="t" x="1340" y="822" text-anchor="middle">Editorial evaluation</text>
  <text class="s" x="1340" y="858" text-anchor="middle">a proposal pass, then a review pass:</text>
  <text class="s" x="1340" y="886" text-anchor="middle">corrections go into the spine;</text>
  <text class="s" x="1340" y="914" text-anchor="middle">optional material into the fund,</text>
  <text class="s" x="1340" y="942" text-anchor="middle">accepted, held as candidate, or rejected</text>

  <path class="ln" d="M1096,878 L780,878 L780,725" marker-end="url(#a)"/>
  <text class="lab" x="940" y="864" text-anchor="middle">published as a new version</text>
  <text class="xs" x="940" y="912" text-anchor="middle">the next reader meets</text>
  <text class="xs" x="940" y="938" text-anchor="middle">the evolved book</text>

  <!-- Author's guiding hand -->
  <path class="gold" d="M20,95 L8,95 L8,1025 L471,1025 L471,725" marker-end="url(#ag)"/>
  <text class="gl" x="26" y="934">the author approves vignettes,</text>
  <text class="gl" x="26" y="962">points, library and media;</text>
  <text class="gl" x="26" y="990">can revise any version</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
