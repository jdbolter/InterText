<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2}
      .t{font-size:22px;fill:#111;font-weight:700}
      .tb{font-size:19px;fill:#111;font-weight:700}
      .s{font-size:18px;fill:#333}
      .si{font-size:16.5px;fill:#333}
      .xs{font-size:16px;fill:#555}
      .ln{stroke:#333;stroke-width:2.2;fill:none}
      .gold{stroke:#8a5a00;stroke-width:2.2;fill:none;stroke-dasharray:9 7}
      .lab{font-size:17px;fill:#333;font-style:italic}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <!-- Author and original text -->
  <rect class="box" x="40" y="40" width="290" height="90" rx="10" style="fill:#f4efe6"/>
  <text class="t" x="185" y="78" text-anchor="middle">Author</text>
  <text class="s" x="185" y="106" text-anchor="middle">writes the book</text>

  <rect class="box" x="40" y="250" width="290" height="130" rx="10"/>
  <text class="t" x="185" y="290" text-anchor="middle">Original text</text>
  <text class="s" x="185" y="322" text-anchor="middle">the author's book,</text>
  <text class="s" x="185" y="346" text-anchor="middle">divided into sections</text>
  <path class="ln" d="M185,130 L185,246" marker-end="url(#a)"/>
  <path class="ln" d="M330,315 L386,315" marker-end="url(#a)"/>

  <!-- System prompts -->
  <rect class="box" x="390" y="20" width="480" height="130" rx="10" style="fill:#eef3f8"/>
  <text class="t" x="630" y="50" text-anchor="middle">System prompts</text>
  <text class="xs" x="630" y="72" text-anchor="middle">the same for every text</text>
  <text class="s" x="410" y="98">• develop the argument from the original, without drift</text>
  <text class="s" x="410" y="120">• keep close to the author's tone; avoid LLM tics</text>
  <text class="s" x="410" y="142">• cite only from the library</text>

  <!-- The interactive book -->
  <rect x="390" y="180" width="480" height="400" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
  <text class="t" x="630" y="214" text-anchor="middle">The interactive book</text>

  <rect class="box" x="410" y="232" width="215" height="100" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="517" y="260" text-anchor="middle">Opening vignettes</text>
  <text class="si" x="517" y="285" text-anchor="middle">one per section; fixed,</text>
  <text class="si" x="517" y="307" text-anchor="middle">the only canonical text</text>

  <rect class="box" x="635" y="232" width="215" height="100" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="742" y="260" text-anchor="middle">Points</text>
  <text class="si" x="742" y="285" text-anchor="middle">the argument of each</text>
  <text class="si" x="742" y="307" text-anchor="middle">section and chapter</text>

  <rect class="box" x="410" y="344" width="215" height="110" rx="8"/>
  <text class="tb" x="517" y="372" text-anchor="middle">Spine</text>
  <text class="si" x="517" y="397" text-anchor="middle">the book's text, section</text>
  <text class="si" x="517" y="419" text-anchor="middle">by section, in passages;</text>
  <text class="si" x="517" y="441" text-anchor="middle">never shown as such</text>

  <rect class="box" x="635" y="344" width="215" height="110" rx="8" style="stroke-dasharray:8 6"/>
  <text class="tb" x="742" y="372" text-anchor="middle">Fund</text>
  <text class="si" x="742" y="397" text-anchor="middle">extra units, built up</text>
  <text class="si" x="742" y="419" text-anchor="middle">over time; drawn on</text>
  <text class="si" x="742" y="441" text-anchor="middle">when warranted</text>

  <rect class="box" x="410" y="466" width="215" height="96" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="517" y="494" text-anchor="middle">Library</text>
  <text class="si" x="517" y="519" text-anchor="middle">verified references, the</text>
  <text class="si" x="517" y="541" text-anchor="middle">only works it may cite</text>

  <rect class="box" x="635" y="466" width="215" height="96" rx="8" style="fill:#fbf8f2"/>
  <text class="tb" x="742" y="494" text-anchor="middle">Media</text>
  <text class="si" x="742" y="519" text-anchor="middle">checked images</text>
  <text class="si" x="742" y="541" text-anchor="middle">and videos</text>

  <!-- Web search -->
  <rect class="box" x="935" y="30" width="250" height="80" rx="10" style="fill:#eef3f8;stroke-dasharray:8 6"/>
  <text class="tb" x="1060" y="62" text-anchor="middle">Web search</text>
  <text class="xs" x="1060" y="88" text-anchor="middle">facts beyond the book</text>
  <path class="ln" d="M1060,110 L1060,176" marker-end="url(#a)"/>

  <!-- LLM: two passes -->
  <rect x="920" y="180" width="280" height="400" rx="14" fill="#eef3f8" stroke="#333" stroke-width="2"/>
  <text class="t" x="1060" y="214" text-anchor="middle">LLM, two passes</text>

  <rect class="box" x="940" y="232" width="240" height="130" rx="8"/>
  <text class="tb" x="1060" y="262" text-anchor="middle">1  Draft</text>
  <text class="si" x="1060" y="290" text-anchor="middle">speaks as the text,</text>
  <text class="si" x="1060" y="312" text-anchor="middle">answering the reader</text>
  <text class="si" x="1060" y="334" text-anchor="middle">from the section</text>

  <rect class="box" x="940" y="410" width="240" height="150" rx="8"/>
  <text class="tb" x="1060" y="440" text-anchor="middle">2  Revision</text>
  <text class="si" x="1060" y="468" text-anchor="middle">edits the draft for style</text>
  <text class="si" x="1060" y="490" text-anchor="middle">and length, close to the</text>
  <text class="si" x="1060" y="512" text-anchor="middle">author's tone; adds</text>
  <text class="si" x="1060" y="534" text-anchor="middle">no new ideas</text>
  <path class="ln" d="M1060,362 L1060,406" marker-end="url(#a)"/>

  <path class="ln" d="M870,380 L916,380" marker-end="url(#a)"/>
  <path class="ln" d="M870,85 C900,85 905,130 918,178" marker-end="url(#a)"/>
  <text class="lab" x="914" y="138">steer</text>

  <!-- Reader -->
  <rect class="box" x="1300" y="232" width="260" height="328" rx="12" style="fill:#f4efe6"/>
  <text class="t" x="1430" y="300" text-anchor="middle">Reader</text>
  <text class="s" x="1430" y="336" text-anchor="middle">reads, questions,</text>
  <text class="s" x="1430" y="360" text-anchor="middle">challenges, comments</text>
  <text class="xs" x="1430" y="410" text-anchor="middle">chooses at the start</text>
  <text class="xs" x="1430" y="432" text-anchor="middle">whether to contribute</text>
  <path class="ln" d="M1296,297 L1184,297" marker-end="url(#a)"/>
  <text class="lab" x="1242" y="285" text-anchor="middle">question</text>
  <path class="ln" d="M1184,485 L1296,485" marker-end="url(#a)"/>
  <text class="lab" x="1242" y="473" text-anchor="middle">reply</text>

  <!-- Contribution loop -->
  <path class="ln" d="M1430,560 L1430,646" marker-end="url(#a)"/>
  <text class="lab" x="1442" y="598">end of session,</text>
  <text class="lab" x="1442" y="620">if contributing</text>

  <rect class="box" x="1150" y="650" width="410" height="180" rx="12" style="fill:#f7f7f7"/>
  <text class="t" x="1355" y="686" text-anchor="middle">Editorial evaluation</text>
  <text class="s" x="1355" y="716" text-anchor="middle">a proposal pass, then a review pass:</text>
  <text class="s" x="1355" y="742" text-anchor="middle">corrections go into the spine;</text>
  <text class="s" x="1355" y="768" text-anchor="middle">optional material into the fund,</text>
  <text class="s" x="1355" y="794" text-anchor="middle">accepted, held as candidate, or rejected</text>

  <path class="ln" d="M1146,740 L742,740 L742,584" marker-end="url(#a)"/>
  <text class="lab" x="944" y="728" text-anchor="middle">published as a new version</text>
  <text class="xs" x="944" y="766" text-anchor="middle">the next reader meets the evolved book</text>

  <!-- Author's guiding hand -->
  <path class="gold" d="M40,85 L18,85 L18,860 L517,860 L517,584" marker-end="url(#ag)"/>
  <text x="30" y="818" style="font-size:17px;fill:#8a5a00;font-style:italic">the author approves vignettes, points,</text>
  <text x="30" y="842" style="font-size:17px;fill:#8a5a00;font-style:italic">library and media; can revise any version</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
