<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uncanny Doubles — beats probe</title>
  <style>
    :root {
      --bg:     #f2efe8;
      --text:   #1c1c1c;
      --muted:  #7a7869;
      --border: #d5d0c4;
      --panel:  #131210;
      --gold:   #c8a96e;
      --serif:  Georgia, 'Times New Roman', serif;
      --sans:   'Helvetica Neue', Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
    }
    .wrap { width: 100%; max-width: 680px; display: flex; flex-direction: column; flex: 1; }
    nav {
      display: flex; gap: 0.4rem; flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .nav-btn {
      font-family: var(--sans); font-size: 0.62rem; letter-spacing: 0.12em;
      text-transform: uppercase; background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 0.35rem 0.7rem; cursor: pointer;
    }
    .nav-btn.active {
      background: var(--panel); color: var(--bg); border-color: var(--panel);
    }
    header { text-align: center; margin-bottom: 1.8rem; }
    .eyebrow {
      font-family: var(--sans); font-size: 0.62rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.7rem;
    }
    h1 { font-size: 1.5rem; font-weight: normal; }
    #beat-chip {
      font-family: var(--sans); font-size: 0.62rem; letter-spacing: 0.12em;
      color: var(--muted); margin-top: 0.6rem; text-transform: uppercase;
    }
    #transcript { flex: 1; overflow-y: auto; padding: 0.5rem 0 1.2rem; }
    .turn { margin-bottom: 1.3rem; line-height: 1.55; }
    .turn.reader { color: var(--muted); }
    .turn.reader::before { content: "— "; }
    .turn.book { border-left: 2px solid var(--gold); padding-left: 0.9rem; white-space: pre-wrap; }
    .divider {
      text-align: center; color: var(--border); font-family: var(--sans);
      font-size: 0.65rem; letter-spacing: 0.3em; margin: 1.6rem 0;
    }
    form { display: flex; gap: 0.6rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    textarea {
      flex: 1; font-family: var(--serif); font-size: 1rem; background: transparent;
      border: 1px solid var(--border); padding: 0.6rem 0.8rem; resize: none; height: 4.2rem;
      color: var(--text);
    }
    textarea:focus { outline: none; border-color: var(--gold); }
    button[type="submit"] {
      font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
      background: var(--panel); color: var(--bg); border: none; padding: 0 1.4rem; cursor: pointer;
    }
    button[type="submit"]:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav id="section-nav" aria-label="Essay sections">
      <button class="nav-btn" data-section="0">I</button>
      <button class="nav-btn active" data-section="1">II</button>
      <button class="nav-btn" data-section="2">III</button>
      <button class="nav-btn" data-section="3">IV</button>
      <button class="nav-btn" data-section="4">V</button>
    </nav>

    <header>
      <div class="eyebrow">A probe, not a product</div>
      <h1 id="section-title">Film and the Uncanny</h1>
      <div id="beat-chip">literary-inheritance</div>
    </header>
    <div id="transcript">
      <div class="turn book">This is one section of an argument about media and the double. Begin wherever you like — ask, object, or simply say: go on.</div>
    </div>
    <form id="chat-form">
      <textarea id="input" placeholder="Speak to the book…" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const transcript = document.getElementById('transcript');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const chip = document.getElementById('beat-chip');
    const titleEl = document.getElementById('section-title');

    const SECTION_TITLES = [
      'The Uncanny Valley & the Double',
      'Film and the Uncanny',
      'The Double in Film',
      'Uncanny Avatars in Mirror Worlds',
      'Feature, not a Bug',
    ];

    const SECTION_FIRST_BEATS = [
      'vr-ultimate-medium',
      'literary-inheritance',
      'film-uncanny-explains-doubling',
      'avatar-double-par-excellence',
      'remediation-claim',
    ];

    let history = [];
    let beatIndex = 0;
    let sectionIndex = 1;

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const newSection = parseInt(btn.dataset.section, 10);
        if (newSection === sectionIndex) return;
        sectionIndex = newSection;
        beatIndex = 0;
        history = [];

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        titleEl.textContent = SECTION_TITLES[sectionIndex];
        chip.textContent = SECTION_FIRST_BEATS[sectionIndex];

        transcript.innerHTML = '<div class="turn book">This is one section of an argument about media and the double. Begin wherever you like — ask, object, or simply say: go on.</div>';
        input.focus();
      });
    });

    function addTurn(role, text) {
      const div = document.createElement('div');
      div.className = 'turn ' + role;
      div.textContent = text;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function addDivider() {
      const div = document.createElement('div');
      div.className = 'divider';
      div.textContent = '· · ·';
      transcript.appendChild(div);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTurn('reader', text);
      input.value = '';
      send.disabled = true;

      try {
        const res = await fetch('/api/beats-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history, beatIndex, sectionIndex })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        addTurn('book', data.response);
        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: data.response });

        if (data.advance) {
          beatIndex += 1;
          addDivider();
        }
        chip.textContent = data.advance ? data.nextBeatId : data.beatId;
      } catch (err) {
        addTurn('book', '[The book is unavailable: ' + err.message + ']');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
